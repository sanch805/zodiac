<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know your Zodiac</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
</style>
</head>
<body>

<!-- Background sparkle canvas -->
<canvas id="bgCanvas"></canvas>

<!-- Navbar -->
<nav class="navbar">
  <div class="wordmark">Know your Zodiac</div>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Back</a></li>
  </ul>
  <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<!-- Mobile nav drawer -->
<div class="nav-drawer" id="navDrawer">
  <button class="nav-drawer-close" id="navDrawerClose" aria-label="Close menu">✕</button>
  <a href="index.html" onclick="closeDrawer()">Back</a>
</div>

<script>
  const hamburger = document.getElementById('navHamburger');
  const drawer    = document.getElementById('navDrawer');
  const drawerClose = document.getElementById('navDrawerClose');

  function openDrawer() {
    drawer.classList.add('open');
    hamburger.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    hamburger.classList.remove('open');
    document.body.style.overflow = '';
  }

  hamburger.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  drawer.addEventListener('click', e => { if (e.target === drawer) closeDrawer(); });
</script>

<!-- Sparkle controls panel -->
<div class="panel hidden" id="panel">
  <div class="panel-header">
    <span class="panel-title">Controls</span>
    <button class="panel-reset" id="reset-btn">Reset</button>
  </div>
  <div class="panel-body">
    <div class="section-label">Particles</div>
    <div class="control">
      <div class="control-row">
        <span class="control-label">Density</span>
        <span class="control-value" id="density-val">0.5</span>
      </div>
      <input type="range" id="density" min="0.1" max="1" step="0.05" value="0.5">
    </div>
    <div class="control">
      <div class="control-row">
        <span class="control-label">Speed</span>
        <span class="control-value" id="speed-val">0.5</span>
      </div>
      <input type="range" id="speed" min="0" max="1" step="0.05" value="0.5">
    </div>
    <div class="control">
      <div class="control-row">
        <span class="control-label">Flicker</span>
        <span class="control-value" id="flicker-val">0.5</span>
      </div>
      <input type="range" id="flicker" min="0.1" max="1" step="0.05" value="0.5">
    </div>
    <div class="divider"></div>
    <div class="section-label">Size</div>
    <div class="control">
      <div class="control-row">
        <span class="control-label">Min size</span>
        <span class="control-value" id="minsize-val">0.5px</span>
      </div>
      <input type="range" id="minsize" min="0.5" max="5" step="0.5" value="0.5">
    </div>
    <div class="control">
      <div class="control-row">
        <span class="control-label">Max size</span>
        <span class="control-value" id="maxsize-val">1px</span>
      </div>
      <input type="range" id="maxsize" min="0.5" max="15" step="0.5" value="1">
    </div>
    <div class="divider"></div>
    <div class="section-label">Color</div>
    <div class="color-row">
      <div class="color-control">
        <span class="color-label">Sparkle</span>
        <div class="color-swatch-wrap">
          <input type="color" id="pcolor" value="#FFFBF0">
        </div>
      </div>
      <div class="color-control">
        <span class="color-label">Background</span>
        <div class="color-swatch-wrap">
          <input type="color" id="bgcolor" value="#3D4FA2">
        </div>
      </div>
    </div>
  </div>
</div>

<button class="toggle-btn" id="toggle-btn">
  <span class="dot"></span>
  Controls
</button>

<script>
/* ═══════════════════════════════════════════
   SPARKLE BACKGROUND
═══════════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');

  const VELOCITY_SCALE = 0.08;
  const DEFAULTS = {
    density: 0.5, speed: 0.5, flicker: 0.5,
    minSize: 0.5, maxSize: 1,
    particleColor: '#FFFBF0', background: '#3D4FA2'
  };

  let config = { ...DEFAULTS };
  let particles = [];
  let shootingStars = [];
  let rafId = null;
  let lastTime = 0;
  let shootingStarTimer = 0;

  function parseHex(hex) {
    return {
      r: parseInt(hex.slice(1,3),16)/255,
      g: parseInt(hex.slice(3,5),16)/255,
      b: parseInt(hex.slice(5,7),16)/255
    };
  }

  function mapDensity(ui) {
    const t = (Math.max(0.1, Math.min(1, ui)) - 0.1) / 0.9;
    return 5 + t * 55;
  }

  function mapFlicker(ui) {
    const t = (Math.max(0.1, Math.min(1, ui)) - 0.1) / 0.9;
    return 0.5 + t * 11.5;
  }

  function initParticles() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const count = Math.floor((w * h) / 10000 * mapDensity(config.density));
    const vm = config.speed * VELOCITY_SCALE;
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * vm,
      vy: (Math.random() - 0.5) * vm,
      size: config.minSize + Math.random() * Math.max(0, config.maxSize - config.minSize),
      opacity: Math.random(),
      opacityVel: (Math.random() - 0.5) * 0.04
    }));
  }

  function spawnShootingStar(w, h) {
    const angle = (Math.PI / 6) + Math.random() * (Math.PI / 6);
    const speed = 6 + Math.random() * 6;
    const length = 80 + Math.random() * 140;
    let x, y;
    if (Math.random() < 0.6) { x = Math.random() * w * 0.85; y = -10; }
    else { x = -10; y = Math.random() * h * 0.45; }
    shootingStars.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      length, opacity: 0, life: 0, maxLife: 55 + Math.random() * 40, headSize: 1.2 + Math.random() * 1.2 });
  }

  function drawShootingStar(s, pc) {
    const angle = Math.atan2(s.vy, s.vx);
    const tailX = s.x - Math.cos(angle) * s.length * s.opacity;
    const tailY = s.y - Math.sin(angle) * s.length * s.opacity;
    const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
    const c = `${Math.round(pc.r*255)},${Math.round(pc.g*255)},${Math.round(pc.b*255)}`;
    grad.addColorStop(0, `rgba(${c},0)`);
    grad.addColorStop(0.6, `rgba(${c},${s.opacity * 0.45})`);
    grad.addColorStop(1, `rgba(${c},${s.opacity})`);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.headSize * 3);
    glow.addColorStop(0, `rgba(${c},${s.opacity})`);
    glow.addColorStop(1, `rgba(${c},0)`);
    ctx.globalAlpha = s.opacity;
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.headSize * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgb(${c})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.headSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
    initParticles();
  }

  function animate(now) {
    const dt = lastTime === 0 ? 1 : Math.min((now - lastTime) / 16.67, 3);
    lastTime = now;
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    const bg = parseHex(config.background);
    const pc = parseHex(config.particleColor);
    const flicker = mapFlicker(config.flicker);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = `rgb(${Math.round(bg.r*255)},${Math.round(bg.g*255)},${Math.round(bg.b*255)})`;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = `rgb(${Math.round(pc.r*255)},${Math.round(pc.g*255)},${Math.round(pc.b*255)})`;
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) p.x = w; else if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; else if (p.y > h) p.y = 0;
      p.opacity += p.opacityVel * flicker * 0.5 * dt;
      if (p.opacity <= 0.1) { p.opacity = 0.1; p.opacityVel = Math.abs(p.opacityVel); }
      else if (p.opacity >= 1) { p.opacity = 1; p.opacityVel = -Math.abs(p.opacityVel); }
      ctx.globalAlpha = p.opacity;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    shootingStarTimer += dt;
    if (shootingStarTimer > 200 + Math.random() * 260) {
      shootingStarTimer = 0;
      spawnShootingStar(w, h);
      if (Math.random() < 0.3) setTimeout(() => spawnShootingStar(w, h), 350 + Math.random() * 500);
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt;
      const progress = s.life / s.maxLife;
      if (progress < 0.15) s.opacity = progress / 0.15;
      else if (progress < 0.72) s.opacity = 1;
      else s.opacity = 1 - (progress - 0.72) / 0.28;
      s.opacity = Math.max(0, Math.min(1, s.opacity));
      if (s.life >= s.maxLife || s.x > w + 150 || s.y > h + 150) { shootingStars.splice(i, 1); continue; }
      drawShootingStar(s, pc);
    }
    rafId = requestAnimationFrame(animate);
  }

  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    lastTime = 0;
    rafId = requestAnimationFrame(animate);
  }

  function bindRange(id, key, labelId, suffix = '') {
    const el = document.getElementById(id);
    const lbl = document.getElementById(labelId);
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      config[key] = v;
      lbl.textContent = v + suffix;
      if (key === 'density') initParticles();
      else if (key === 'speed') {
        const vm = v * VELOCITY_SCALE;
        particles.forEach(p => { p.vx = (Math.random()-0.5)*vm; p.vy = (Math.random()-0.5)*vm; });
      } else if (key === 'minSize' || key === 'maxSize') {
        particles.forEach(p => { p.size = config.minSize + Math.random()*Math.max(0, config.maxSize-config.minSize); });
      }
    });
  }

  bindRange('density','density','density-val');
  bindRange('speed','speed','speed-val');
  bindRange('flicker','flicker','flicker-val');
  bindRange('minsize','minSize','minsize-val','px');
  bindRange('maxsize','maxSize','maxsize-val','px');

  document.getElementById('pcolor').addEventListener('input', e => { config.particleColor = e.target.value; });
  document.getElementById('bgcolor').addEventListener('input', e => { config.background = e.target.value; });

  document.getElementById('reset-btn').addEventListener('click', () => {
    config = { ...DEFAULTS };
    ['density','speed','flicker','minsize','maxsize'].forEach(id => {
      const keyMap = {density:'density',speed:'speed',flicker:'flicker',minsize:'minSize',maxsize:'maxSize'};
      document.getElementById(id).value = DEFAULTS[keyMap[id]];
    });
    document.getElementById('density-val').textContent = DEFAULTS.density;
    document.getElementById('speed-val').textContent = DEFAULTS.speed;
    document.getElementById('flicker-val').textContent = DEFAULTS.flicker;
    document.getElementById('minsize-val').textContent = DEFAULTS.minSize + 'px';
    document.getElementById('maxsize-val').textContent = DEFAULTS.maxSize + 'px';
    document.getElementById('pcolor').value = DEFAULTS.particleColor;
    document.getElementById('bgcolor').value = DEFAULTS.background;
    initParticles();
  });

  const panel = document.getElementById('panel');
  const toggleBtn = document.getElementById('toggle-btn');
  let panelOpen = false; // starts closed
  toggleBtn.addEventListener('click', () => {
    panelOpen = !panelOpen;
    panel.classList.toggle('hidden', !panelOpen);
    toggleBtn.querySelector('.dot').style.animationPlayState = panelOpen ? 'running' : 'paused';
  });

  window.addEventListener('resize', resize);
  resize();
  start();
})();

</script>
</body>
</html>
